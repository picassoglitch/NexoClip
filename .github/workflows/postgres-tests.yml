name: Postgres tests

# Runs the database-backed suites against a real Postgres service, the same
# way they run against the local throwaway cluster in development. Setting
# NEXOCLIP_TEST_PG_DSN flips the shared test fixtures (tests/_db_backend.py)
# from a throwaway SQLite file to Postgres, so these suites exercise the
# actual production engine — the asyncpg facade, the ON CONFLICT idioms, and
# the consolidated PG baseline — with no dialect drift.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexoclip_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXOCLIP_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/nexoclip_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Repo + DB suites on Postgres
        # The repo layer is the core deliverable: every query, the ON CONFLICT
        # idioms, bool/float binding, and the migration baseline run here.
        # test_pipeline_dual_write is excluded — it fails on main too (a stale
        # `_USE_SUBPROCESS` monkeypatch, unrelated to the DB backend); track
        # that separately rather than block the Postgres gate on it.
        run: pytest tests/db --ignore=tests/db/test_pipeline_dual_write.py -q

      - name: API integration suite on Postgres
        # Exercises the HTTP layer end-to-end against Postgres. Pre-existing
        # baseline failures (tracked separately) mean this is reported, not
        # gated, until the baseline is burned down.
        continue-on-error: true
        run: pytest tests/api -q
