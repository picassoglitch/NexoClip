# LLM provider configuration.
# Copy to llm.yaml and edit as needed.
#
# API keys are loaded from environment variables (see .env.example).
# This file controls model selection, routing, and rate limits — not credentials.
#
# Cost policy: all purposes route to `openllm` / `openllm_vision` — a
# self-hosted OpenAI-compatible runtime (Ollama, LM Studio, vLLM,
# llama.cpp-server) with ZERO per-token cost. The anthropic block stays
# defined so any purpose can be pointed back at it (or added as a
# fallback) deliberately; nothing routes there by default, so no call
# can silently spend money.

providers:
  # Self-hosted open models. Default base_url is a local Ollama; the
  # NEXOCLIP_OPENLLM_BASE_URL env var overrides it in prod (point it at a
  # tunneled/hosted runtime). Keyless by default — if you use a hosted
  # OpenAI-compatible gateway instead, set OPENLLM_API_KEY.
  openllm:
    kind: openai_compatible
    api_key_env: OPENLLM_API_KEY
    api_key_required: false
    base_url: http://localhost:11434/v1
    base_url_env: NEXOCLIP_OPENLLM_BASE_URL
    models:
      standard: qwen2.5:7b-instruct              # strong ES/EN + reliable JSON at 7B
      premium: qwen2.5:14b-instruct              # bump if the box has VRAM for it
    timeout_s: 120                               # local inference is slower than an API

  # Vision-capable open model for the multimodal purposes (clip scoring,
  # visual variant generation). Same runtime, different model tag.
  openllm_vision:
    kind: openai_compatible
    api_key_env: OPENLLM_API_KEY
    api_key_required: false
    base_url: http://localhost:11434/v1
    base_url_env: NEXOCLIP_OPENLLM_BASE_URL
    models:
      standard: qwen2.5vl:7b
      premium: qwen2.5vl:7b
    timeout_s: 180

  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    models:
      standard: claude-haiku-4-5                # fast + cheap, great for structured short-form
      premium: claude-opus-4-6                  # premium quality for high-stakes generation
    rate_limits:
      requests_per_minute: 1000
      input_tokens_per_minute: 400000
      output_tokens_per_minute: 80000
    timeout_s: 30

# Routing rules per "purpose" (the use case of the call).
# The router resolves: purpose -> quality -> provider -> model.
routing:
  variant_generation:
    default_quality: standard
    primary: openllm
    fallbacks: []

  variant_generation_visual:                    # Phase 2+, multimodal
    default_quality: standard
    primary: openllm_vision
    fallbacks: []

  clip_scoring:                                 # Phase 2+, multimodal scoring
    default_quality: standard
    primary: openllm_vision
    fallbacks: []

  agent_decision:                               # alter-ego auto-approval reasoning
    default_quality: premium
    primary: openllm
    fallbacks: []

  viral_detection:                              # LLM scan of transcript for viral moments
    default_quality: standard
    primary: openllm
    fallbacks: []

  logo_generation:                              # AI-generated SVG brand mark (voice-markers §3.3.a)
    default_quality: premium
    primary: openllm
    fallbacks: []

  hook_generation:                              # Viral-hook title variants (slice F.7-B)
    default_quality: standard
    primary: openllm
    fallbacks: []

  growth_score:                                 # Pre-publish Growth Score card (per-platform fit + verdict)
    default_quality: premium
    primary: openllm
    fallbacks: []

# Reliability
retry:
  max_attempts: 3
  initial_backoff_s: 1.0
  backoff_multiplier: 4.0
  retryable_status_codes: [429, 500, 502, 503, 504]

circuit_breaker:
  error_rate_threshold: 0.20                    # >20% errors over window -> trip
  window_s: 300
  recovery_s: 300

# Cost tracking — used to compute cost_usd_micros per call.
# Open models have no pricing entry: unlisted (provider, model) pairs cost 0.
pricing:
  anthropic:
    claude-haiku-4-5:
      input_per_mtok_usd: 1.00
      output_per_mtok_usd: 5.00
    claude-opus-4-6:
      input_per_mtok_usd: 15.00
      output_per_mtok_usd: 75.00
