# LLM provider configuration.
# Copy to llm.yaml and edit as needed.
#
# API keys are loaded from environment variables (see .env.example).
# This file controls model selection, routing, and rate limits — not credentials.
#
# Anthropic is the only configured provider. The router supports an
# arbitrary fallback chain, so a second provider can be added later by
# defining it under `providers:` and listing it in a routing rule's
# `fallbacks:`. Earlier versions of this file shipped an OpenAI fallback
# block; it was removed to keep the live surface single-vendor.

providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    models:
      standard: claude-haiku-4-5-20251001       # fast + cheap, great for structured short-form
      premium: claude-opus-4-7                  # premium quality for high-stakes generation
    rate_limits:
      requests_per_minute: 1000
      input_tokens_per_minute: 400000
      output_tokens_per_minute: 80000
    timeout_s: 30

# Routing rules per "purpose" (the use case of the call).
# The router resolves: purpose -> quality -> provider -> model.
# `fallbacks: []` means no fallback: if Anthropic is down, the call fails
# loudly rather than silently degrading.
routing:
  variant_generation:
    default_quality: standard
    primary: anthropic
    fallbacks: []

  variant_generation_visual:                    # Phase 2+, multimodal
    default_quality: premium
    primary: anthropic
    fallbacks: []

  clip_scoring:                                 # Phase 2+, multimodal scoring
    default_quality: premium
    primary: anthropic
    fallbacks: []

  vision_rescore:                               # Phase 2 Task 3, vision-LLM rescore of top-K candidates
    default_quality: standard                   # premium = opt-in via --quality flag
    primary: anthropic
    fallbacks: []

  agent_decision:                               # alter-ego auto-approval reasoning
    default_quality: premium
    primary: anthropic
    fallbacks: []

  viral_detection:                              # LLM scan of transcript for viral moments
    default_quality: standard
    primary: anthropic
    fallbacks: []

  logo_generation:                              # AI-generated SVG brand mark (voice-markers §3.3.a)
    default_quality: premium
    primary: anthropic
    fallbacks: []

  hook_generation:                              # Viral-hook title variants (slice F.7-B)
    default_quality: standard
    primary: anthropic
    fallbacks: []

  growth_score:                                 # Pre-publish Growth Score card (per-platform fit + verdict)
    default_quality: premium
    primary: anthropic
    fallbacks: []

# Reliability
retry:
  max_attempts: 3
  initial_backoff_s: 1.0
  backoff_multiplier: 4.0
  retryable_status_codes: [429, 500, 502, 503, 504]

circuit_breaker:
  error_rate_threshold: 0.20                    # >20% errors over window -> trip
  window_s: 300
  recovery_s: 300

# Cost tracking — used to compute cost_usd_micros per call.
# These rates are illustrative; verify against current Anthropic pricing
# before launch.
pricing:
  anthropic:
    claude-haiku-4-5-20251001:
      input_per_mtok_usd: 0.80
      output_per_mtok_usd: 4.00
    claude-opus-4-7:
      input_per_mtok_usd: 15.00
      output_per_mtok_usd: 75.00
