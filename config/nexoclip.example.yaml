# NexoClip main configuration.
# Copy to nexoclip.yaml and edit for your local setup.

# Output directory for stream artifacts
output_dir: ./out

# Whisper transcription
whisper:
  device: cuda                      # cuda | cpu
  model: medium                     # tiny | base | small | medium | large-v3
  compute_type: float16             # float16 | int8 | int8_float16
  language: es                      # ISO 639-1; null = auto-detect

# Trigger detection
detection:
  # Voice triggers (Phase 0)
  voice:
    enabled: true
    weight: 1.0
    fuzzy_distance: 2               # Levenshtein tolerance for transcription errors
    phrases:
      es:
        - "clipéalo"
        - "clipea esto"
        - "saca un clip"
        - "guarda esto"
        - "momento clip"
        - "este momento"
      en:
        - "clip this"
        - "clip that"
        - "someone clip this"

  # Chat heat (Phase 1)
  chat_heat:
    enabled: false                  # turn on in Phase 1
    weight: 0.7
    baseline_window_s: 300          # 5-min rolling baseline
    spike_ratio: 3.0                # fires when current rate > 3x baseline
    absolute_floor_msg_per_s: 5.0

  # Audio energy (Phase 1)
  audio_energy:
    enabled: false                  # turn on in Phase 1
    weight: 0.5
    baseline_window_s: 300
    spike_ratio: 2.5
    sustain_s: 1.5

  # Visual signals (Phase 1)
  visual:
    enabled: false                  # turn on in Phase 1
    weight: 0.6

  # Candidate merging
  merge_window_s: 30                # candidates within this window collapse to one

# Clip cutting
clip:
  pre_roll_s: 30                    # seconds before trigger
  post_roll_s: 15                   # seconds after trigger
  output_aspect: "9:16"
  output_width: 1080
  output_height: 1920
  encoder: libx264
  preset: fast
  crf: 23
  burn_captions: false              # Phase 0 leaves captions off; Phase 1 turns on

# Variant generation
variants:
  per_persona: 5                    # number of variants generated per clip per persona
  default_quality: standard         # standard | premium

# Logging
log:
  level: INFO
  format: console                   # console | json
