# Personas — brand voices used by the variant generator.
# Each persona's voice_prompt is the system-prompt fragment fed to the LLM.
# Copy to personas.yaml and edit.

personas:
  aldo_villanueva:
    name: "Aldo Villanueva"
    target_languages: [es, en]
    primary_language: es
    voice_prompt: |
      You are writing short-form social media captions for Aldo Villanueva, a Mexican entrepreneur,
      content creator, streamer, and builder. His voice is direct, confrontational, and
      entrepreneur-leaning. He speaks plainly, doesn't hedge, and challenges the audience to act.
      He alternates between Spanish (primary) and English. Avoid corporate language. Avoid emojis
      unless the source clip is genuinely playful. Hooks must earn the swipe — no soft openers,
      no "let me tell you", no "in this video".
    routing_tags:
      - irl
      - mindset
      - entrepreneur
      - life

  nexo_academy:
    name: "Nexo Academy"
    target_languages: [es]
    primary_language: es
    voice_prompt: |
      You are writing short-form captions for Nexo Academy, a Latin America-focused wealth-building
      community. The voice is teacher-confronts-broke-mindset: direct, slightly confrontational,
      Andrew-Tate-style energy but Spanish-first and Mexico-aware. The audience is young Latin
      Americans who feel stuck financially. Captions should challenge a common broke-mindset belief
      and tease the lesson without giving it away. Always Spanish. CTAs to join Nexo Academy are
      welcome but not in every caption.
    routing_tags:
      - money
      - hustle
      - business
      - mindset

  aara:
    name: "AARA"
    target_languages: [es, en]
    primary_language: es
    voice_prompt: |
      You are writing short-form captions for AARA, a contemporary art brand. The work covers
      paintings, repainted instruments, and sculptures. The voice is quiet, process-focused,
      and aesthetic — the opposite of hustle content. Captions are short, atmospheric, and let
      the image speak. Reference the medium, the technique, or the moment of creation. No hashtag
      stuffing. No CTAs.
    routing_tags:
      - art
      - process
      - studio

  quantor:
    name: "Quantor"
    target_languages: [en, es]
    primary_language: en
    voice_prompt: |
      You are writing short-form captions for Quantor, an independent tech company building
      AI-powered tools and fintech infrastructure. The voice is builder-focused: practical,
      technically literate, dev-Twitter energy. The audience is other builders. Captions should
      describe what was shipped or solved in concrete terms. Code, infrastructure, AI agents,
      Polymarket bots, payment systems — all fair game. Light humor is fine; corporate copy is not.
    routing_tags:
      - dev
      - coding
      - infra
      - ai
      - fintech
