<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexoClip - Login</title>
  <link rel="stylesheet" href="/static/nexoclip-theme.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.17.0/dist/tabler-icons.min.css">
</head>
<body>
  <div class="nc-login-shell">
    <div class="nc-login-card">
      <h1>NEXOCLIP</h1>
      <small>The AI growth engine for streamers. Paste your API token to sign in.</small>

      {% if error %}
      <div class="nc-alert nc-alert--danger" style="margin-top: 16px;">
        <div class="nc-alert__icon"><i class="ti ti-alert-circle" aria-hidden="true"></i></div>
        <div class="nc-alert__body">
          <div class="nc-alert__title">Sign-in failed</div>
          <div class="nc-alert__detail">{{ error }}</div>
        </div>
      </div>
      {% endif %}

      <form action="/dashboard/login" method="post" style="margin-top: 16px;">
        <label class="nc-label">API token
          <input type="password"
                 class="nc-input nc-input--mono"
                 name="token"
                 placeholder="tok_..."
                 required
                 autofocus>
        </label>
        <button type="submit" class="nc-btn nc-btn--primary nc-btn--full">
          <i class="ti ti-login" aria-hidden="true"></i>
          <span>Sign in</span>
        </button>
      </form>

      <small style="display: block; margin-top: 16px; line-height: 1.6;">
        Issue a token via
        <code>nexoclip tokens issue --tenant &lt;id&gt; --scope full</code>.
      </small>
    </div>
  </div>
</body>
</html>
