{% extends "base.html" %}
{% block title %}Edit {{ persona.id }} - NexoClip{% endblock %}
{% block content %}

<div class="nc-page-header">
  <div>
    <h2>Edit persona</h2>
    <small><span class="nc-mono">{{ persona.id }}</span></small>
  </div>
  <div class="nc-page-summary">
    <a href="/dashboard/personas" class="nc-btn nc-btn--sm">
      <i class="ti ti-arrow-left" aria-hidden="true"></i>
      <span>All personas</span>
    </a>
  </div>
</div>

<div class="nc-panel">
  <div class="nc-panel__body">
    <form action="/dashboard/personas/{{ persona.id }}" method="post">
      <div class="nc-grid-2">
        <label class="nc-label">Name
          <input class="nc-input" name="name" value="{{ persona.name }}">
        </label>
        <label class="nc-label">Primary lang
          <input class="nc-input nc-input--mono" name="primary_language" value="{{ persona.primary_language }}">
        </label>
      </div>
      <label class="nc-label">Voice prompt
        <textarea class="nc-textarea" name="voice_prompt" rows="4">{{ persona.voice_prompt }}</textarea>
      </label>
      <div class="nc-grid-2">
        <label class="nc-label">Target languages
          <input class="nc-input" name="target_languages" value="{{ persona.target_languages|join(', ') }}">
        </label>
        <label class="nc-label">Routing tags
          <input class="nc-input" name="routing_tags" value="{{ persona.routing_tags|join(', ') }}">
        </label>
      </div>
      <div class="nc-row">
        <button type="submit" class="nc-btn nc-btn--primary">
          <i class="ti ti-device-floppy" aria-hidden="true"></i>
          <span>Save</span>
        </button>
        <a href="/dashboard/personas" class="nc-btn">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
