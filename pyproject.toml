[project]
name = "nexoclip"
version = "0.1.0"
description = "Multi-tenant SaaS that turns streamer VODs into multi-platform short-form clips."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Aldo Villanueva" }]

dependencies = [
    # LLM provider — Anthropic only. OpenAI was kept as a fallback option
    # in earlier phases but removed in favor of a single-vendor surface;
    # the router still supports N providers if a future config re-adds one.
    "anthropic>=0.40.0",

    # VOD ingest
    "yt-dlp>=2024.10.0",

    # Speech-to-text default is now AssemblyAI (cloud, no GPU dep).
    # See Migration Tasks A1-A3 in the project root for the rationale:
    # AssemblyAI does word timestamps + diarization in one API call at
    # ~$0.17/hr with no GPU/CUDA on the host. The legacy faster-whisper
    # / pyannote stack is still available as the `local-whisper` and
    # `diarize` optional extras for setups that want local-GPU inference;
    # leaving them as optional means a fresh `pip install nexoclip`
    # doesn't pull torch (~2 GB) for everyone.

    # Media (we shell out to ffmpeg binary; ffmpeg-python wraps it cleanly)
    "ffmpeg-python>=0.2.0",

    # Schemas + config
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",

    # CLI
    "typer>=0.12",
    "rich>=13.7",

    # HTTP / async
    "httpx>=0.27",

    # IDs
    "python-ulid>=2.7",

    # Persistence (Phase 0: filesystem only — aiosqlite arrives in Phase 1)
    "aiosqlite>=0.20",

    # Logging
    "structlog>=24.4",

    # Env
    "python-dotenv>=1.0",

    # Local vision pipeline (Phase 1 Task 5): scene cuts, face presence, motion.
    # Face detection uses OpenCV's bundled Haar Cascade (cv2.data.haarcascades)
    # — no model download, no extra dep. Real emotion classification arrives
    # in Phase 2 via the multimodal LLM; Phase 1 only signals face-present.
    "scenedetect>=0.6.4",
    "opencv-python>=4.10",

    # Brand-kit thumbnail compositing (voice-markers spec slice D.4).
    # We composite the picked raw frame with brand colors + handle overlay
    # into 16:9 / 9:16 / 1:1 variants for downstream publishers.
    "pillow>=10.4",

    # Speaker diarization (voice-markers spec slice B). pyannote-3.1 is a
    # gated HuggingFace model — operator must accept the license and set
    # HF_TOKEN in .env. The dashboard ships without pyannote installed too;
    # nexoclip.diarize.service short-circuits when the import fails.
    # Bring it in as an OPTIONAL extra (`pip install 'nexoclip[diarize]'`)
    # so a fresh `pip install nexoclip` doesn't pull torch by default.
    # (Listed in [project.optional-dependencies] below.)

    # REST API + HTMX dashboard (Phase 1 Tasks 9-10).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",

    # MCP server — translation layer over the REST surface for external agents
    # (Claude Code / Cursor / etc.). Phase 3 #3.
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
    "respx>=0.21",                      # httpx mock for LLM + Buffer tests
]
local-whisper = [
    # Local GPU/CPU Whisper via faster-whisper. Required if you set
    # NEXOCLIP_TRANSCRIBE_PROVIDER=local. Production deploys default
    # to AssemblyAI (no GPU dep) — this extra exists for self-hosted
    # users who want local inference. Python <= 3.12 required per the
    # boot guard in run.py.
    "faster-whisper>=1.0.3",
]
diarize = [
    # pyannote-audio for speaker diarization (voice-markers spec slice B).
    # Pulls torch via dep chain — ~2GB install on Windows. Skip if you
    # don't need per-speaker labeling.
    #
    # NOTE: with Migration Task A2 (Aug 2026), production uses AssemblyAI's
    # built-in speaker_labels=true for diarization — no pyannote install
    # required for the per-video labels case. This extra stays available
    # for local-Whisper users + as the cross-video embedding path until
    # we re-add cross-video identity via a Modal job. Default deploys do
    # NOT install it.
    #
    # Pinned to 3.3.2: 3.4.0 references torchaudio.AudioMetaData which
    # was removed in torchaudio 2.8+. Likewise huggingface_hub<1.0
    # because hub 1.0 dropped the `use_auth_token` kwarg pyannote still
    # passes. And speechbrain<1.1 because 1.1 added a lazy
    # `speechbrain.integrations.k2_fsa` import that pyannote's
    # pipeline construction trips, requiring the `k2` package which
    # is effectively Linux-only. Until upstream pyannote ships a fix
    # these pins are the known-good combo. Tested with torch==2.4.1+cu121.
    "pyannote.audio==3.3.2",
    "huggingface_hub>=0.23,<1.0",
    "speechbrain>=1.0,<1.1",
]

[project.scripts]
nexoclip = "nexoclip.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexoclip"]

# ---------- Tooling ----------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]                       # line length is enforced by formatter

[tool.ruff.lint.per-file-ignores]
"nexoclip/cli.py" = ["B008"]            # typer.Option(...) defaults are idiomatic
"nexoclip/api/routers/*.py" = ["B008"]  # FastAPI Depends(...) defaults are idiomatic
"nexoclip/api/deps.py" = ["B008"]       # FastAPI Depends(...) defaults are idiomatic

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
# Worker entry points run as subprocesses; their dependencies (pyannote,
# torch) are optional and stubs aren't shipped. Excluded from strict typing
# so the dashboard can ship without those deps installed.
exclude = ["tests/", "nexoclip/diarize/_worker.py"]

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "yt_dlp.*",
    "ffmpeg.*",
    "yaml",
    "scenedetect.*",
    "cv2.*",
    "pyannote.*",
    "torch.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
