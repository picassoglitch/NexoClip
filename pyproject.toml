[project]
name = "nexoclip"
version = "0.1.0"
description = "Multi-tenant SaaS that turns streamer VODs into multi-platform short-form clips."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Aldo Villanueva" }]

dependencies = [
    # LLM provider — Anthropic only. OpenAI was kept as a fallback option
    # in earlier phases but removed in favor of a single-vendor surface;
    # the router still supports N providers if a future config re-adds one.
    "anthropic>=0.40.0",

    # VOD ingest
    "yt-dlp>=2024.10.0",

    # Speech-to-text (CUDA build of faster-whisper for GPU; falls back to CPU)
    "faster-whisper>=1.0.3",

    # Media (we shell out to ffmpeg binary; ffmpeg-python wraps it cleanly)
    "ffmpeg-python>=0.2.0",

    # Schemas + config
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",

    # CLI
    "typer>=0.12",
    "rich>=13.7",

    # HTTP / async
    "httpx>=0.27",

    # IDs
    "python-ulid>=2.7",

    # Persistence (Phase 0: filesystem only — aiosqlite arrives in Phase 1)
    "aiosqlite>=0.20",

    # Logging
    "structlog>=24.4",

    # Env
    "python-dotenv>=1.0",

    # Local vision pipeline (Phase 1 Task 5): scene cuts, face presence, motion.
    # Face detection uses OpenCV's bundled Haar Cascade (cv2.data.haarcascades)
    # — no model download, no extra dep. Real emotion classification arrives
    # in Phase 2 via the multimodal LLM; Phase 1 only signals face-present.
    "scenedetect>=0.6.4",
    "opencv-python>=4.10",

    # REST API + HTMX dashboard (Phase 1 Tasks 9-10).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",

    # MCP server — translation layer over the REST surface for external agents
    # (Claude Code / Cursor / etc.). Phase 3 #3.
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
    "respx>=0.21",                      # httpx mock for LLM + Buffer tests
]

[project.scripts]
nexoclip = "nexoclip.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexoclip"]

# ---------- Tooling ----------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]                       # line length is enforced by formatter

[tool.ruff.lint.per-file-ignores]
"nexoclip/cli.py" = ["B008"]            # typer.Option(...) defaults are idiomatic
"nexoclip/api/routers/*.py" = ["B008"]  # FastAPI Depends(...) defaults are idiomatic
"nexoclip/api/deps.py" = ["B008"]       # FastAPI Depends(...) defaults are idiomatic

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "yt_dlp.*",
    "ffmpeg.*",
    "yaml",
    "scenedetect.*",
    "cv2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
